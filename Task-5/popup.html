<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Popup</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #d8f3dc;
            color: #2f2a24;
        }

        .page {
            width: min(100%, 700px);
            padding: 48px 28px;
            text-align: center;
            background-color: rgba(255, 252, 247, 0.88);
            border-radius: 24px;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2rem, 4vw, 2.8rem);
        }

        p {
            margin: 0 0 26px;
            line-height: 1.6;
        }

        .open-btn,
        .close-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .open-btn {
            background-color: #2d6a4f;
            color: #fffdf8;
            box-shadow: 0 12px 24px rgba(45, 106, 79, 0.28);
        }

        .open-btn:hover,
        .close-btn:hover {
            transform: translateY(-2px);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background-color: rgba(18, 18, 18, 0.556);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .modal:target {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal-box {
            width: min(100%, 420px);
            position: relative;
            padding: 32px 28px;
            border-radius: 20px;
            background-color: #fffaf1;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
            text-align: center;
            transform: translateY(24px) scale(0.94);
            transition: transform 0.35s ease;
        }

        .modal:target .modal-box {
            transform: translateY(0) scale(1);
        }

        .close-btn {
            background-color: #dfeee3;
            color: #23412f;
        }

        .close-icon {
            position: absolute;
            top: 14px;
            right: 16px;
            color: #6d5d4d;
            text-decoration: none;
            font-size: 1.5rem;
            line-height: 1;
        }
    </style>
</head>
<body>
    <main class="page" id="home">
        <h1>Modal Popup</h1>
        <p>
            Click on the button below to open a modal popup.
        </p>
        <a href="#modal" class="open-btn">Open Popup</a>
    </main>

    <section id="modal" class="modal">
        <div class="modal-box">
            <a href="#home" class="close-icon" aria-label="Close modal">&times;</a>
            <h2>Welcome</h2>
            <p>
                The popup is centered on the page, includes a dark overlay, and
                animates in smoothly.
            </p>
            <a href="#home" class="close-btn">Close</a>
        </div>
    </section>
</body>
</html>
